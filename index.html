<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; connect-src https://parroto-proxy.quangthanh1107304.workers.dev; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Xem comment Parroto</title>
</head>
<body>
  <h1>Xem comment bài học</h1>
  <input id="link" size="60" placeholder="Dán link bài học vào đây">
  <label><input type="checkbox" id="onlySystem" checked> Chỉ lấy bình luận từ hệ thống</label>
  <label><input type="checkbox" id="onlyUser"> Chỉ lấy comment người dùng</label>
  <button onclick="start()">Lấy comment</button>
  <button id="btnExcel" disabled>Tải file Excel</button>
  <p id="status"></p>
  <ul id="list"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const PROXY = "https://parroto-proxy.quangthanh1107304.workers.dev/";
const MAX_PAGES = 200;

let allComments = [];
let currentId = "";
let running = false;

// Chống "Excel injection": tên bắt đầu bằng = + - @ sẽ được thêm dấu ' phía trước
function safe(s) {
  s = String(s == null ? "" : s);
  return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
}

function nameOf(c) {
  return c.author && c.author.displayName ? c.author.displayName : "(không rõ tên)";
}

function exportExcel() {
  const rows = allComments
    .filter(c => c.is_system && c.system_meta && c.system_meta.type === "shadowing")
    .map(c => ({
      "Name": safe(nameOf(c)),
      "Time": new Date(c.created_at * 1000).toLocaleString("vi-VN"),
      "Completed Shadowing": c.system_meta.score
    }));

  if (rows.length === 0) {
    alert("Không có comment hệ thống (Completed Shadowing) nào để xuất.");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(rows, { header: ["Name", "Time", "Completed Shadowing"] });
  ws["!cols"] = [{ wch: 25 }, { wch: 20 }, { wch: 50 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Comments");
  XLSX.writeFile(wb, "parroto-" + currentId + ".xlsx");
}

document.getElementById("btnExcel").onclick = exportExcel;

document.getElementById("onlySystem").onchange = function () {
  if (this.checked) document.getElementById("onlyUser").checked = false;
};
document.getElementById("onlyUser").onchange = function () {
  if (this.checked) document.getElementById("onlySystem").checked = false;
};

async function start() {
  if (running) return; // đang chạy thì bỏ qua lần bấm thứ hai
  const link = document.getElementById("link").value;
  const status = document.getElementById("status");
  const list = document.getElementById("list");
  const btnExcel = document.getElementById("btnExcel");

  const match = link.match(/[0-9a-f]{24}/i);
  if (!match) { status.textContent = "Không tìm thấy ID bài học trong link."; return; }

  running = true;
  list.textContent = "";
  btnExcel.disabled = true;
  allComments = [];
  const id = match[0].toLowerCase();
  currentId = id;
  const onlyUser = document.getElementById("onlyUser").checked;
  const onlySystem = document.getElementById("onlySystem").checked;

  try {
    let page = 1, totalPages = 1, count = 0;
    while (page <= totalPages) {
      status.textContent = "Đang tải trang " + page + "...";
      const res = await fetch(PROXY + "?id=" + id + "&page=" + page + "&limit=10");
      if (!res.ok) throw new Error("Lỗi " + res.status);
      const json = await res.json();

      const tp = json && json.data ? json.data.totalPages : null;
      if (!Number.isInteger(tp) || tp < 1) throw new Error("Dữ liệu trả về không đúng dạng");
      totalPages = Math.min(tp, MAX_PAGES);
      if (!Array.isArray(json.data.comments)) throw new Error("Dữ liệu trả về không đúng dạng");

      for (const c of json.data.comments) {
        allComments.push(c);
        if (onlyUser && c.is_system) continue;
        if (onlySystem && !c.is_system) continue;
        const li = document.createElement("li");
        const date = new Date(c.created_at * 1000).toLocaleString("vi-VN");
        li.textContent = nameOf(c) + " (" + date + "): " + c.content;
        list.appendChild(li);
        count++;
      }
      page++;
      await new Promise(r => setTimeout(r, 300));
    }
    status.textContent = "Xong, hiển thị " + count + " comment.";
    btnExcel.disabled = false;
  } catch (e) {
    status.textContent = "Có lỗi: " + e.message;
  } finally {
    running = false;
  }
}

(function autoStartFromUrl() {
  const idFromUrl = new URLSearchParams(location.search).get("id");
  if (idFromUrl && /^[0-9a-f]{24}$/i.test(idFromUrl)) {
    document.getElementById("link").value = idFromUrl;
    start();
  }
})();
</script>
</body>
</html>
